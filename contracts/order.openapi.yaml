openapi: 3.0.3
info: { title: Order API, version: v1 }
servers: [ { url: http://localhost:5102 } ]
paths:
  /orders/v1/orders:
    get:
      operationId: ListOrders
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Order' } } } } }
    post:
      operationId: PlaceOrder
      description: Validates products via Catalog, saves Pending order, publishes OrderPlaced. Saga continues asynchronously.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateOrderRequest' } } } }
      responses:
        '201': { description: Created (Pending), content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '400': { $ref: '#/components/responses/ProblemResponse' }
        '503': { $ref: '#/components/responses/ProblemResponse' }
  /orders/v1/orders/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
    get:
      operationId: GetOrder
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '404': { $ref: '#/components/responses/ProblemResponse' }
    put:
      operationId: UpdateOrder
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateOrderRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '400': { $ref: '#/components/responses/ProblemResponse' }
        '404': { $ref: '#/components/responses/ProblemResponse' }
    delete:
      operationId: DeleteOrder
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/ProblemResponse' }
  /orders/v1/orders/{id}/cancel:
    parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
    post:
      operationId: CancelOrder
      description: On-demand compensation for a Confirmed order (refund + release stock).
      responses:
        '200': { description: Cancelled, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '404': { $ref: '#/components/responses/ProblemResponse' }
        '409': { $ref: '#/components/responses/ProblemResponse' }
components:
  responses:
    ProblemResponse: { description: Problem Details, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  schemas:
    OrderStatus: { type: string, enum: [Pending, StockReserved, Confirmed, Cancelled] }
    OrderItem:
      type: object
      properties: { productId: { type: integer }, quantity: { type: integer }, unitPrice: { type: number } }
    Order:
      type: object
      properties:
        id: { type: integer }
        customerName: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        total: { type: number }
        paymentId: { type: integer, nullable: true }
        cancelReason: { type: string, nullable: true }
        correlationId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        items: { type: array, items: { $ref: '#/components/schemas/OrderItem' } }
    CreateOrderRequest:
      type: object
      required: [customerName, lines]
      properties:
        customerName: { type: string, maxLength: 100 }
        forcePaymentFailure: { type: boolean, default: false, description: Demo switch to trigger compensation }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [productId, quantity]
            properties: { productId: { type: integer, minimum: 1 }, quantity: { type: integer, minimum: 1, maximum: 1000 } }
    UpdateOrderRequest:
      type: object
      required: [customerName]
      properties: { customerName: { type: string, maxLength: 100 } }
    ProblemDetails:
      type: object
      additionalProperties: true
      properties:
        type: { type: string, nullable: true }
        title: { type: string, nullable: true }
        status: { type: integer, nullable: true }
        detail: { type: string, nullable: true }
