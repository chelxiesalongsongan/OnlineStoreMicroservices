openapi: 3.0.3

info:
  title: Catalog Service API
  description: API for managing products in the catalog.
  version: 1.0.0

servers:
  - url: http://localhost:5047

paths:

  /catalog/v1/products:

    get:
      summary: Get all products
      description: Returns all products in the catalog.
      operationId: getProducts
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'

    post:
      summary: Create a product
      description: Creates a new product in the catalog.
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
      responses:
        '201':
          description: Product created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid product data.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /catalog/v1/products/{id}:

    get:
      summary: Get a product by ID
      description: Returns a specific product using its ID.
      operationId: getProduct
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the product.
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Product found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

    put:
      summary: Update a product
      description: Updates an existing product.
      operationId: updateProduct
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the product to update.
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequest'
      responses:
        '200':
          description: Product updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid product data.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Product not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

    delete:
      summary: Delete a product
      description: Deletes an existing product.
      operationId: deleteProduct
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the product to delete.
          schema:
            type: integer
            format: int32
      responses:
        '204':
          description: Product deleted successfully.
        '404':
          description: Product not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

components:

  schemas:

    Product:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 1
        name:
          type: string
          example: Car Window Tint
        price:
          type: number
          format: double
          example: 5000
        stock:
          type: integer
          format: int32
          example: 10

    ProductCreateRequest:
      type: object
      required:
        - name
        - price
        - stock
      properties:
        name:
          type: string
          example: Car Window Tint
        price:
          type: number
          format: double
          minimum: 0.01
          example: 5000
        stock:
          type: integer
          format: int32
          minimum: 0
          example: 10

    ProductUpdateRequest:
      type: object
      required:
        - name
        - price
        - stock
      properties:
        name:
          type: string
          example: Premium Car Window Tint
        price:
          type: number
          format: double
          minimum: 0.01
          example: 7500
        stock:
          type: integer
          format: int32
          minimum: 0
          example: 8

    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          example: https://tools.ietf.org/html/rfc9110
        title:
          type: string
          example: Not Found
        status:
          type: integer
          example: 404
        detail:
          type: string
        instance:
          type: string
        traceId:
          type: string
